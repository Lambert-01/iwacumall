<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1455d9">
  <title>Reset password | IwacuMall</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/reset-password.js"></script>
</head>
<body>
  <div class="announcement">IwacuMall · Account recovery</div>
  <main class="inner-page">
    <section class="admin-card" style="max-width:520px;margin:3rem auto;padding:2rem">
      <div class="section-label">ACCOUNT SECURITY</div>
      <h1>Choose a new password</h1>
      <p>This reset link can only be used once and expires after one hour.</p>
      <form id="resetForm" class="admin-form">
        <label>New password<input name="password" type="password" class="form-control" autocomplete="new-password" minlength="10" maxlength="128" required></label>
        <label>Confirm password<input name="confirmPassword" type="password" class="form-control" autocomplete="new-password" minlength="10" maxlength="128" required></label>
        <p id="resetError" class="form-error" hidden></p>
        <button class="btn btn-primary full" type="submit">Update password</button>
      </form>
      <p id="resetSuccess" hidden>Your password was updated. <a href="/">Return to IwacuMall and sign in.</a></p>
    </section>
  </main>
</body>
</html>
