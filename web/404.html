<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1455D9">
  <title>Page Not Found | IwacuMall</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/overrides.css">
  <style>
    .not-found-box {
      max-width: 560px;
      margin: 80px auto;
      text-align: center;
      padding: 40px 24px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(8, 31, 98, 0.08);
    }
    .not-found-emoji {
      font-size: 64px;
      margin-bottom: 16px;
    }
    .not-found-title {
      font-size: 28px;
      font-weight: 900;
      color: #081F62;
      margin-bottom: 12px;
    }
    .not-found-desc {
      color: #4A5568;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="/" aria-label="IwacuMall home">
        <img src="/assets/favicon.png" alt="">
        <span>Iwacu<span class="brand-accent">Mall</span></span>
      </a>
      <div class="header-actions" style="margin-left:auto">
        <a class="btn btn-primary" href="/">Go to Homepage</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="not-found-box">
      <div class="not-found-emoji">🛍️</div>
      <h1 class="not-found-title">Page not found (404)</h1>
      <p class="not-found-desc">The item or page you are looking for does not exist or may have been moved. Explore our catalog to find everyday essentials.</p>
      <a class="btn btn-primary" href="/#products">Browse all products →</a>
    </div>
  </main>

  <footer class="footer" style="margin-top:60px;">
    <div class="container footer-bottom">
      <span>© IwacuMall. All rights reserved.</span>
      <span>Downtown Kigali, Rwanda ✦</span>
    </div>
  </footer>
</body>
</html>
