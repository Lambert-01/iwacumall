plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def signingPropertiesFile = rootProject.file("key.properties")
if (!signingPropertiesFile.exists()) {
    signingPropertiesFile = rootProject.file("../../honest-release-signing-files/key.properties")
}
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingStoreFilePath = signingProperties.getProperty("storeFile", "").trim()
def signingStoreFile = signingStoreFilePath ? rootProject.file(signingStoreFilePath) : null
def signingRequiredProperties = ["keyAlias", "keyPassword", "storePassword", "storeFile"]
def releaseSigningReady = signingPropertiesFile.exists()
    && signingRequiredProperties.every { signingProperties.getProperty(it, "").trim() }
    && signingStoreFile != null
    && signingStoreFile.isFile()

android {
    namespace = "com.iwacumall.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Confirm this package name is available and owned before store publication.
        applicationId = "com.iwacumall.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                keyAlias = signingProperties.getProperty("keyAlias")
                keyPassword = signingProperties.getProperty("keyPassword")
                storeFile = signingStoreFile
                storePassword = signingProperties.getProperty("storePassword")
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingPropertiesFile.exists() ? signingConfigs.release : null
        }
    }
}

tasks.configureEach {
    def taskName = name.toLowerCase()
    if ((taskName.startsWith('assemble') || taskName.startsWith('bundle')) && taskName.contains('release')) {
        doFirst {
            if (!releaseSigningReady) {
                throw new GradleException('Release signing is not configured. Provide a valid ignored key.properties file and keystore; keep both out of version control.')
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation("androidx.core:core:1.12.0")
}
